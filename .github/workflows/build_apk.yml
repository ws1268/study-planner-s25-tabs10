name: Build Galaxy S25 & Tab S10 Ultra APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ensure Persistent Signing Key (For Seamless In-Place App Updates)
        run: |
          mkdir -p ~/.android
          if [ -f android/fixed_debug.keystore ]; then
            cp android/fixed_debug.keystore ~/.android/debug.keystore
            echo "Restored persistent signing key from android/fixed_debug.keystore"
          else
            keytool -genkey -v -keystore android/fixed_debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            cp android/fixed_debug.keystore ~/.android/debug.keystore
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add android/fixed_debug.keystore
            git commit -m "chore: save persistent signing keystore for seamless in-place updates [skip ci]" || true
            git push origin HEAD:main || true
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Flutter Android scaffold while preserving custom code
        run: |
          mkdir -p /tmp/custom_backup
          cp -r pubspec.yaml lib android /tmp/custom_backup/
          flutter create . --project-name study_planner_app --org com.example --platforms android
          cp -r /tmp/custom_backup/pubspec.yaml .
          cp -r /tmp/custom_backup/lib/* lib/
          cp -r /tmp/custom_backup/android/* android/
          echo "" >> android/gradle.properties
          echo "kotlin.jvm.target.validation.mode=warning" >> android/gradle.properties

      - name: Configure Android Gradle for Desugaring & SDK 34
        run: |
          python3 - << 'EOF'
          import pathlib, re

          gradle_kts = pathlib.Path("android/app/build.gradle.kts")
          gradle_groovy = pathlib.Path("android/app/build.gradle")

          if gradle_groovy.exists():
              txt = gradle_groovy.read_text()
              if "coreLibraryDesugaringEnabled" not in txt:
                  txt = txt.replace(
                      "compileOptions {",
                      "compileOptions {\n        coreLibraryDesugaringEnabled true"
                  )
                  txt += "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'\n}\n"
              txt = re.sub(r"minSdk\s+.*", "minSdk 23", txt)
              txt = re.sub(r"minSdkVersion\s+.*", "minSdkVersion 23", txt)
              gradle_groovy.write_text(txt)
          elif gradle_kts.exists():
              txt = gradle_kts.read_text()
              if "isCoreLibraryDesugaringEnabled" not in txt:
                  txt = txt.replace(
                      "compileOptions {",
                      "compileOptions {\n        isCoreLibraryDesugaringEnabled = true"
                  )
                  txt += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")\n}\n'
              txt = re.sub(r"minSdk\s*=\s*\S+", "minSdk = 23", txt)
              gradle_kts.write_text(txt)
          EOF

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Release APK with Auto-Incrementing Build Number
        run: |
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --dart-define=APP_BUILD_NUMBER=${{ github.run_number }}

      - name: Publish Latest APK to GitHub Releases for 1-Click In-App OTA Update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk study-planner-s25-tabs10.apk
          BUILD_TIME=$(TZ=Asia/Seoul date +"%Y.%m.%d %H:%M")
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest study-planner-s25-tabs10.apk --clobber
            gh release edit latest \
              --title "최신 업데이트 ($BUILD_TIME 빌드, Run #${{ github.run_number }})" \
              --notes "갤럭시 S25 & 탭 S10 Ultra 앱 내 1초 덮어쓰기 업데이트 패키지 (Run #${{ github.run_number }} / $BUILD_TIME)"
          else
            gh release create latest study-planner-s25-tabs10.apk \
              --title "최신 업데이트 ($BUILD_TIME 빌드, Run #${{ github.run_number }})" \
              --notes "갤럭시 S25 & 탭 S10 Ultra 앱 내 1초 덮어쓰기 업데이트 패키지 (Run #${{ github.run_number }} / $BUILD_TIME)"
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: study-planner-s25-tabs10-apk
          path: build/app/outputs/flutter-apk/app-release.apk
